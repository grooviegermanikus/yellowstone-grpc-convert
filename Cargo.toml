[package]
name = "yellowstone-grpc-convert"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Bidirectional conversion between Solana SDK types and yellowstone-grpc protobuf types"
publish = false

[dependencies]
bincode = "1.3.3"

# Yellowstone
yellowstone-grpc-proto = { version = "=12.2.0", features = ["tonic", "account-data-as-bytes"] }

# Agave Monorepo
solana-account-decoder = "~3.1.0"
solana-transaction-context = "~3.1.0"
solana-transaction-status = "~3.1.0"

# Solana SDK
solana-account = "3.0.0"
solana-clock = "3.0.0"
solana-hash = "4.0.0"
solana-message = "3.0.1"
solana-pubkey = "4.0.0"
solana-signature = "3.1.0"
solana-transaction = "3.0.1"
solana-transaction-error = "3.0.0"

[lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"
